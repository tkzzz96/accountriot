version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      nest: { patterns: ["@nestjs/*"] }
      prisma: { patterns: ["prisma", "@prisma/*"] }
      next: { patterns: ["next", "eslint-config-next"] }
      vitest: { patterns: ["vitest", "vite", "@vitest/*"] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/apps/web"
    schedule: { interval: weekly }
